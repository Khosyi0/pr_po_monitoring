name: Otomasi ETL Harian Dashboard

on:
  schedule:
    # Jam 7:30 WIB = Jam 00:30 UTC (GitHub menggunakan standar waktu UTC)
    - cron: '30 0 * * *'
  workflow_dispatch: # Membuat tombol manual di halaman GitHub jika sewaktu-waktu ingin memicu dari sana

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl sqlalchemy psycopg2-binary requests

    - name: Jalankan Script ETL
      env:
        # Masukkan variabel env database kamu di sini agar script bisa connect ke Neon.tech
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_PORT: '5432'
      run: python run_cron_etl.py